name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *" # Her 12 saatte bir çalışır
  workflow_dispatch: # Manuel tetikleme için
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: NebuchOwl
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#22c55e
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ff8c00

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
